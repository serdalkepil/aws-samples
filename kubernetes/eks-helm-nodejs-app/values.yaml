# Default values for eks-nodejs-helm-app.
# Override at install time, for example:
#   helm install web . --set image.repository=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/nodejs-simple-app

replicaCount: 3

image:
  # Set this to your ECR repository (Demo D5 pushes it). No account ID is hard-coded here.
  repository: ""
  pullPolicy: IfNotPresent
  # Empty = use the chart's appVersion
  tag: ""

# Shown on the web page. Change it with --set app.version=2.0 to demo `helm upgrade`.
app:
  version: "1.0"
  color: "#2e025e"

service:
  # ClusterIP by default; use port-forward in class. Set LoadBalancer to get an AWS load balancer.
  type: ClusterIP
  port: 80

ingress:
  # Needs the AWS Load Balancer Controller (or EKS Auto Mode) and creates an ALB.
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi
