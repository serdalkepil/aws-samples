apiVersion: v2
name: eks-nodejs-helm-app
description: Helm chart for the simple NodeJS app used in the EKS course demos (M4 / Demo D6)

# application chart (not a library chart)
type: application

# Chart version: bump on every change to the chart or its templates (SemVer).
version: 0.2.0

# Version of the app this chart deploys; used as the image tag when image.tag is empty.
appVersion: "1.0"
