# Allow client -> nginx:80, plus DNS for client (default deny blocks DNS too)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-egress
  namespace: web
spec:
  podSelector: { matchLabels: { app: client } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: nginx } }
      ports: [ { port: 80, protocol: TCP } ]
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-ingress-from-client
  namespace: web
spec:
  podSelector: { matchLabels: { app: nginx } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: client } }
      ports: [ { port: 80, protocol: TCP } ]
