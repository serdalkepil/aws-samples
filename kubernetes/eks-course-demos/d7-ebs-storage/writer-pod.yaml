apiVersion: v1
kind: Pod
metadata:
  name: writer
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["/bin/sh", "-c", "while true; do date -u >> /data/out.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: 10m, memory: 16Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
