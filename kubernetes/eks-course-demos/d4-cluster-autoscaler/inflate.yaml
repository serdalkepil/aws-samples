# Pending-Pod generator for the Cluster Autoscaler (D4) and Karpenter-style talks (M5 S14-S18).
# Starts at 0 replicas: kubectl scale deploy/inflate --replicas=8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
spec:
  replicas: 0
  selector:
    matchLabels: { app: inflate }
  template:
    metadata:
      labels: { app: inflate }
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: "1", memory: 256Mi }   # 1 vCPU each: a t3.medium (2 vCPU) fits one next to the system Pods
