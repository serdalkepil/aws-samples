apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-identity
  namespace: default
  labels:
    app: pod-identity
  # No eks.amazonaws.com/role-arn annotation: Pod Identity links the role through the EKS API.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-identity
  namespace: default
  labels:
    app: pod-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-identity
  template:
    metadata:
      labels:
        app: pod-identity
    spec:
      serviceAccountName: pod-identity
      containers:
      - name: awscli
        image: public.ecr.aws/aws-cli/aws-cli:latest
        command: ["sleep", "infinity"]
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { memory: 256Mi }
